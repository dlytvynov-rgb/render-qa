name: Build

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: RenderQA-Mac
          path: release/*.dmg
          retention-days: 1

  build-win:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win portable --publish never
        env:
          WIN_CSC_LINK: ""
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: RenderQA-Windows
          path: release/*.exe
          retention-days: 1

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RenderQA-Mac
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: RenderQA-Windows
          path: artifacts/win
      - name: Delete existing latest release
        run: |
          gh release delete latest --repo ${{ github.repository }} --yes || true
          gh api repos/${{ github.repository }}/git/refs/tags/latest -X DELETE || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Render QA — Latest Build"
          body: "Автоматична збірка з останнього коміту на `main`."
          prerelease: true
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
